# 1. SERVER CONFIG (Railway m?c ??nh dÃ¹ng c?ng 8080)
server.port=${PORT:8080}

# 2. DATASOURCE CONFIG (Aiven MySQL yÃªu c?u SSL)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. HIKARI CONNECTION POOL (Fix l?i treo 502 khi k?t n?i DB)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000



# 4. JPA / HIBERNATE CONFIG
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# S? d?ng Dialect th? h? m?i cho MySQL 8+
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# 5. REDIS CONFIG (T?t quÃ©t Repo ?? trÃ¡nh treo lÃºc kh?i ??ng)
spring.data.redis.url=${REDIS_URL}
spring.data.redis.repositories.enabled=false

# 6. SECURITY & JWT
jwt.secret=${JWT_SECRET}
jwt.access-expiration=86400000
jwt.refresh-expiration=2592000000
otp.expire.minutes=5

# 7. MAIL CONFIG
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# 8. LOGGING (GiÃºp b?n debug d? h?n trÃªn Railway)
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=ERROR





